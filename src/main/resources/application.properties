spring.application.name=sepa-instant-agent

# Database (password comes from application-local.properties)
spring.datasource.url=jdbc:mysql://localhost:3306/payments?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=loader_rw

# Flyway creates the tables; Hibernate only checks them
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: expose only health and info
management.endpoints.web.exposure.include=health,info

# Datasource for the agent's lookups (read-only user)
agent.datasource.url=jdbc:mysql://localhost:3306/payments?useSSL=false&allowPublicKeyRetrieval=true
agent.datasource.username=agent_ro

spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

agent.guards.enabled=true